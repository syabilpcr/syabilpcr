<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="84" viewBox="0 0 1000 84" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.fl{transform-box:fill-box;transform-origin:50% 100%;animation-name:flick;animation-iteration-count:infinite;animation-direction:alternate;animation-timing-function:ease-in-out}
@keyframes flick{0%{transform:scale(1,1) skewX(0deg);opacity:.95}30%{transform:scale(.92,1.16) skewX(5deg);opacity:1}65%{transform:scale(1.06,.88) skewX(-5deg);opacity:.85}100%{transform:scale(.96,1.1) skewX(2deg);opacity:1}}
.em{animation-name:rise;animation-iteration-count:infinite;animation-timing-function:linear}
@keyframes rise{0%{transform:translate(0,0);opacity:0}12%{opacity:1}100%{transform:translate(var(--dx),-60px);opacity:0}}
@keyframes glow{0%,100%{opacity:.55}20%{opacity:.35}45%{opacity:.9}70%{opacity:.45}}
@keyframes march{to{stroke-dashoffset:-32}}
@keyframes dash{from{stroke-dashoffset:520}to{stroke-dashoffset:0}}
@keyframes pulse{0%,100%{stroke-opacity:.3}50%{stroke-opacity:1}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}

</style>
<defs>
<path id="f" d="M0,0 C-26,-6 -34,-36 -18,-62 C-14,-50 -8,-46 -4,-48 C-10,-70 0,-92 8,-104 C10,-84 24,-72 28,-48 C34,-26 24,-4 0,0 Z"/>
<linearGradient id="gw" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#d4d4d4" stop-opacity=".9"/><stop offset="1" stop-color="#737373" stop-opacity="0"/></linearGradient>
<linearGradient id="gb" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#9a9a9a" stop-opacity=".85"/><stop offset="1" stop-color="#333" stop-opacity="0"/></linearGradient>
<filter id="blur" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="7"/></filter>
</defs>
<rect x=".5" y=".5" width="999" height="83" rx="12" fill="#000" stroke="#262626"/>
<g transform="translate(46,0)"></g>
<g transform="translate(46,66) scale(.40,.40)"><g class="fl" style="animation-duration:1.1s"><use href="#f" fill="url(#gb)" transform="scale(1.3)"/></g></g>
<g transform="translate(46,66) scale(.40,.40)"><g class="fl" style="animation-duration:1.1s"><use href="#f" fill="url(#gw)"/></g></g>
<g transform="translate(46,66) scale(.40,.40)"><g class="fl" style="animation-duration:1.1s;animation-delay:-.4s"><use href="#f" fill="#000" opacity=".6" transform="scale(.48)"/></g></g>
<circle class="em" cx="23" cy="60" r="2.0" fill="#fff" style="--dx:-17px;animation-duration:3.2s;animation-delay:-3.8s"/>
<circle class="em" cx="30" cy="60" r="1.0" fill="#fff" style="--dx:-21px;animation-duration:4.1s;animation-delay:-4.2s"/>
<circle class="em" cx="18" cy="60" r="2.6" fill="#fff" style="--dx:-8px;animation-duration:4.0s;animation-delay:-4.6s"/>
<circle class="em" cx="81" cy="60" r="2.5" fill="#fff" style="--dx:-18px;animation-duration:3.2s;animation-delay:-1.2s"/>
<circle class="em" cx="70" cy="60" r="1.7" fill="#fff" style="--dx:12px;animation-duration:5.3s;animation-delay:-3.7s"/>
<text x="92" y="55" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="800" font-size="30" letter-spacing="6" fill="#fff"><tspan fill="#737373" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-weight="400">// </tspan>ACTIVITY</text>
<line x1="383" y1="44" x2="960" y2="44" stroke="#fff" stroke-opacity=".18" stroke-width="2"/>
<line x1="383" y1="44" x2="960" y2="44" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-dasharray="70 450" style="animation:dash 3s linear infinite"/>
</svg>
